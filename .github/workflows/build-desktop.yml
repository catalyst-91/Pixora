name: Build PIXORA desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['PIXORA-src.zip']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: --win }
          - { os: macos-15, target: --mac }
          - { os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack PIXORA-src.zip
        shell: bash
        run: python3 -c "import zipfile; zipfile.ZipFile('PIXORA-src.zip').extractall('.')" || python -c "import zipfile; zipfile.ZipFile('PIXORA-src.zip').extractall('.')"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare icons
        shell: bash
        run: node -e "const fs=require('fs'),f='desktop/package.json',p=JSON.parse(fs.readFileSync(f));(p.build.fileAssociations||[]).forEach(a=>delete a.icon);fs.writeFileSync(f,JSON.stringify(p,null,2))"
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install --no-audit --no-fund
          npm run copy-app
          npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PIXORA-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: PIXORA 1.2.0
          files: out/*
          make_latest: true
