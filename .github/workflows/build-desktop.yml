name: Build PIXORA desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['PIXORA-src.zip']
permissions:
  contents: write
jobs:
  # automatic tests: nothing is built or released unless they all pass
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack PIXORA-src.zip
        run: python3 -c "import zipfile; zipfile.ZipFile('PIXORA-src.zip').extractall('.')"
      - uses: actions/checkout@v4
        with: { repository: catalyst-91/QForge, path: qforge-src }
        continue-on-error: true
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run tests
        env: { QFORGE_DIR: qforge-src }
        run: node tests/run-all.js
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: --win }
          - { os: macos-15, target: --mac }
          - { os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack PIXORA-src.zip
        shell: bash
        run: python3 -c "import zipfile; zipfile.ZipFile('PIXORA-src.zip').extractall('.')" || python -c "import zipfile; zipfile.ZipFile('PIXORA-src.zip').extractall('.')"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare icons
        shell: bash
        run: node -e "const fs=require('fs'),f='desktop/package.json',p=JSON.parse(fs.readFileSync(f));(p.build.fileAssociations||[]).forEach(a=>delete a.icon);fs.writeFileSync(f,JSON.stringify(p,null,2))"
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install --no-audit --no-fund
          npm run copy-app
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac --arm64 --publish never
            npx electron-builder --mac --x64 --publish never
          else
            npx electron-builder ${{ matrix.target }} --publish never
          fi
      - name: Ableton Link test (with the Carabiner just built)
        if: runner.os == 'Linux'
        shell: bash
        run: PIXORA_CARABINER=desktop/link-dist/Carabiner node tests/link_test.js
      - uses: actions/upload-artifact@v4
        with:
          name: PIXORA-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/link-dist/carabiner-source.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: python3 -c "import zipfile,json; print('version=' + json.loads(zipfile.ZipFile('PIXORA-src.zip').read('desktop/package.json'))['version'])" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Release notes and manual from the zip
        run: python3 -c "import zipfile; z=zipfile.ZipFile('PIXORA-src.zip'); n=z.namelist(); open('notes.md','wb').write(z.read('RELEASE-NOTES.md') if 'RELEASE-NOTES.md' in n else b''); 'PIXORA-User-Manual.pdf' in n and open('out/PIXORA-User-Manual.pdf','wb').write(z.read('PIXORA-User-Manual.pdf'))"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: PIXORA ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: out/*
          make_latest: true
      - name: Update the front-page README from the zip
        continue-on-error: true
        run: |
          python3 -c "import zipfile; open('README.md','wb').write(zipfile.ZipFile('PIXORA-src.zip').read('README.md'))"
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md && git commit -m "Update README for PIXORA ${{ steps.v.outputs.version }}" && git pull --rebase && git push
          fi
